name: Compilar Agenda Semanal (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'main.py'
      - 'requirements.txt'
      - 'config.json'
      - 'build_windows.bat'
      - '.github/workflows/build-windows.yml'

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes rápidos
        run: python -m unittest discover -s tests -v
      - name: Compilar executável
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AgendaSemanal main.py
      - name: Distribuir configuração editável
        run: Copy-Item config.json dist/config.json
      - name: Publicar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: AgendaSemanal-Windows
          path: |
            dist/AgendaSemanal.exe
            dist/config.json
          if-no-files-found: error
